name: Hey CICD
# on:
#   push:
#     branches:
#       - main
#       - feature/*
on:
  push:
    branches:
      - main
      - feature/*
jobs:
  hello:
    runs-on: ubuntu-latest # Runners are the virtual machines where your workflow jobs run
    steps:
      - name: Print message
        run: echo "Hello from GitHub Actions!"
      - name: Show date
        run: date
      - name: Show operating system
        run: uname -a
  hi:
    runs-on: ubuntu-latest # Runners are the virtual machines where your workflow jobs run
    steps:
      - name: Print message
        run: echo "Hi from GitHub Actions!"
      - name: Show path
        run: pwd
      - name: Show operating system
        run: uname -a
  bye:
    runs-on: ubuntu-latest # Runners are the virtual machines where your workflow jobs run
    steps:
      - name: Print message
        run: echo "Bye from GitHub Actions!"
      - name: Show files and folders
        run: ls -la
      - name: Show disk space
        run: df -h
  secrets-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo $DEMO_SECRET
            echo "Secret is available."
          else
            echo "Secret is not configured."
            exit 1
          fi
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run build
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Show build files
        run: |
          echo "Build output:"
          ls -la build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: session16-build
          path: build/

